<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClearanceRoom — end card</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0c0a09; color: #e7e5e4; overflow: hidden; }
  .wrap { text-align: center; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: 9vw; margin: 0; letter-spacing: 0.04em;
       color: #fbbf24; }
  h1 span { color: #f5f5f4; }
  .tag { font-family: 'JetBrains Mono', monospace; font-size: 1.1vw; letter-spacing: 0.5em;
         text-transform: uppercase; color: #78716c; margin-top: 0.5em; }
  .urls { font-family: 'JetBrains Mono', monospace; font-size: 1.5vw; color: #d6d3d1;
          margin-top: 3em; line-height: 2; }
  .stack { font-family: 'JetBrains Mono', monospace; font-size: 1vw; letter-spacing: 0.35em;
           text-transform: uppercase; color: #57534e; margin-top: 3em; }
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: 0.05;
           background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="wrap">
    <h1>CLEARANCE<span>ROOM</span></h1>
    <div class="tag">every frame cleared</div>
    <div class="urls">
      clearanceroom-957638696965.us-central1.run.app<br>
      github.com/Thatmansimz/clearance-room
    </div>
    <div class="stack">gemini on vertex ai · google adk · parallel search api</div>
  </div>
</body>
</html>
